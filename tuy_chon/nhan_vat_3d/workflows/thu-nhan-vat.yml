name: Thử nhân vật 3D

# Chạy tay: Actions > "Thử nhân vật 3D" > Run workflow.
# Dựng một clip ngắn (~20 giây): nhân vật 3D đi vào, lần lượt làm các tư thế, nói, chỉ tay, rồi đi ra.
# Dùng để kiểm tra mô hình VRM của bạn trước khi dựng video thật.
on:
  workflow_dispatch:

jobs:
  thu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_NHAN_VAT_3D: ${{ vars.DRIVE_NHAN_VAT_3D }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài công cụ hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Cài thư viện Node
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lấy nhân vật VRM từ Google Drive
        run: |
          mkdir -p ~/.config/rclone public/nhan_vat3d
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          NV3="${DRIVE_NHAN_VAT_3D:-VIDEO_XACSUAT/nhan_vat3d}"
          rclone copy "gdrive:$NV3" public/nhan_vat3d --include "*.vrm" --max-size 80M
          ls -la public/nhan_vat3d
          F=$(ls public/nhan_vat3d/*.vrm | head -1)
          if [ -z "$F" ]; then echo "Không thấy tệp .vrm trong $NV3"; exit 1; fi
          if [ "$F" != "public/nhan_vat3d/nhan_vat.vrm" ]; then cp "$F" public/nhan_vat3d/nhan_vat.vrm; fi
      - name: Dựng clip thử
        run: |
          mkdir -p out
          npx remotion render src/index.ts ThuNhanVat out/thu_nhan_vat.mp4 --gl=swangle --timeout=120000
      - uses: actions/upload-artifact@v4
        with:
          name: thu-nhan-vat-3d
          path: out/thu_nhan_vat.mp4
          retention-days: 7

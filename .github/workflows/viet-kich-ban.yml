name: Bộ phận 2 - Viết kịch bản
run-name: "Kịch bản ${{ inputs.id }}"

# Workflow chuyên biệt cho Bộ phận 2: CHỈ xây dựng + kiểm duyệt + tối ưu kịch bản từ đề DA_GIAI -> CO_KICH_BAN.
# Chạy song song độc lập với Bộ phận 1 - Giải đề (bo-phan-1.yml) để cấp kịch bản liên tục cho Bộ phận 3 - Dựng video.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Mã đề (Apps Script tự điền)'
        type: string
        default: ''
      de:
        description: 'Dữ liệu đề JSON (Apps Script tự điền)'
        type: string
        default: ''

concurrency:
  group: viet-kich-ban-${{ inputs.id || github.run_id }}
  cancel-in-progress: false

jobs:
  kich_ban:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      DUNG_VIDEO_SECRET: ${{ secrets.DUNG_VIDEO_SECRET }}
      BP1_DE: ${{ inputs.de }}
      ID_DE: ${{ inputs.id }}
      BP1_VIEC: kich_ban
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*.gs
            phong_cach.json
            bai_hoc_edit.json
            mau_vang
            scripts/bophan1
            scripts/tu_sinh_svg.py
            scripts/kho_manh_svg.py
            scripts/khung4tang_v93.py
            scripts/khung4tang_v95.py
            scripts/khung4tang_v96.py
            scripts/khung4tang_v98.py
            scripts/xac_suat_dong.py
            scripts/ve25d.py
            scripts/giai_hinh_phang.py
            scripts/hinh_phang
            scripts/giai_hinh_khong_gian.py
            scripts/hinh_khong_gian
            mau
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tải ảnh đề từ Drive (nếu có)
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          ANH=$(python3 -c "import json,os;h=(json.loads(os.environ.get('BP1_DE') or '{}').get('hang') or {});f=str(h.get('file_anh') or '');print('' if (not f or f.startswith('http')) else f)")
          if [ -z "$ANH" ]; then echo "Đề không có ảnh"; exit 0; fi
          command -v rclone >/dev/null || (curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors https://rclone.org/install.sh | sudo bash > /dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq rclone))
          mkdir -p ~/.config/rclone anh_de
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone backend copyid --retries 3 --retries-sleep 5s gdrive: "$ANH" anh_de/ || { echo "Không tải được ảnh đề, vẫn viết kịch bản bằng mô tả"; exit 0; }
          F=$(ls anh_de | head -1)
          if [ -n "$F" ]; then echo "BP1_ANH=$PWD/anh_de/$F" >> "$GITHUB_ENV"; echo "Đã tải ảnh đề: $F"; fi

      - name: Xây dựng & duyệt kịch bản
        run: node scripts/bophan1/chay_bp1.js

      - name: In kết quả chạy thử
        if: ${{ always() && env.ID_DE == '' }}
        run: |
          python3 - <<'PY'
          import json, os
          if not os.path.exists("ket_qua_bp1.json"):
              print("Không có ket_qua_bp1.json"); raise SystemExit
          d = json.load(open("ket_qua_bp1.json", encoding="utf8"))
          h = d.get("hang") or {}
          print("TRANG_THAI:", h.get("trang_thai"), "| GHI_CHU:", str(h.get("ghi_chu"))[:400])
          for x in (d.get("nhat_ky") or [])[-30:]:
              print("NK", x[1], str(x[2])[:400])
          PY

      - name: Gửi kết quả về Apps Script
        if: ${{ always() && env.APPS_SCRIPT_URL != '' && env.ID_DE != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          run_url = "https://github.com/%s/actions/runs/%s" % (os.environ.get("GITHUB_REPOSITORY", ""), os.environ.get("GITHUB_RUN_ID", ""))
          if os.path.exists("ket_qua_bp1.json"):
              d = json.load(open("ket_qua_bp1.json", encoding="utf8"))
          else:
              d = {"id": os.environ["ID_DE"], "ok": False, "hang": None,
                   "loi": "Workflow viet-kich-ban gap su co (" + run_url + ")"}
          if os.path.exists("/tmp/gemini_key_hong.json"):
              try: d["key_hong"] = json.load(open("/tmp/gemini_key_hong.json", encoding="utf8"))
              except Exception: pass
          d["token"] = os.environ["DUNG_VIDEO_SECRET"]
          try:
              request = json.loads(os.environ.get("BP1_DE") or "{}")
          except Exception:
              request = {}
          d["lan_giao"] = (request.get("hang") or {}).get("lan_giao", "")
          d["viec"] = request.get("viec", "")
          d["run_url"] = run_url
          d["loai"] = "bo_phan_1"
          d["id"] = d.get("id") or os.environ["ID_DE"]
          json.dump(d, open("gui_bp1.json", "w", encoding="utf8"), ensure_ascii=False)
          PY
          for lan in 1 2 3 4 5 6 7; do
            KQ=$(curl -sS -L --max-time 45 --retry 3 --retry-delay 5 --retry-all-errors -H 'Content-Type: application/json' --data @gui_bp1.json "$APPS_SCRIPT_URL" || true)
            echo "Lần $lan: $KQ"
            if echo "$KQ" | grep -Eq '"ok" *: *true'; then exit 0; fi
            if echo "$KQ" | grep -q 'KHONG_TIM_THAY'; then exit 0; fi
            if echo "$KQ" | grep -q 'SAI_TOKEN'; then exit 1; fi
            if echo "$KQ" | grep -q 'BAN'; then sleep 45; continue; fi
            if [ "$lan" -ge 3 ]; then break; fi
            sleep $((lan * 10))
          done
          echo "Không báo được kết quả về Apps Script"; exit 1

      - name: Xác nhận đầu ra BP2
        if: ${{ success() && env.ID_DE != '' }}
        run: |
          python3 - <<'PY'
          import json
          with open("ket_qua_bp1.json", encoding="utf8") as f:
              result = json.load(f)
          row = result.get("hang") or {}
          if not result.get("kich_ban") or row.get("trang_thai") != "CO_KICH_BAN":
              raise SystemExit("BP2 chưa bàn giao kịch bản: " + str(result.get("loi") or row.get("ghi_chu") or row.get("trang_thai")))
          PY

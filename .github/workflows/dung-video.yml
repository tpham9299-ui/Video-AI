name: Bộ phận 3 - Dựng video
run-name: "Dựng video ${{ inputs.id || inputs.mau || github.run_number }}"

# Kích hoạt:
#  - Apps Script (BoPhan2.gs) gửi "workflow_dispatch" kèm ref = nhánh trong CAU_HINH > GITHUB_NHANH: GitHub chạy ĐÚNG mã của
#    nhánh đó (mặc định nhánh claude/... mới nhất), không còn dựng bằng mã cũ của nhánh master.
#  - "repository_dispatch" (cách cũ) vẫn nhận, để không hỏng khi token chưa có quyền Actions; cách này luôn chạy mã nhánh mặc định.
#  - viec = dang: đăng video đã dựng lên Facebook / TikTok / YouTube (DangVideo.gs hẹn giờ gọi).
#  - Chạy thử tay: Actions > Dựng video > Run workflow (chọn nhánh, chọn kịch bản mẫu; không báo kết quả về Apps Script).
on:
  repository_dispatch:
    types: [dung-video]
  workflow_dispatch:
    inputs:
      mau:
        description: 'Kịch bản mẫu để dựng thử (khi không có kich_ban)'
        type: choice
        options: [kich_ban_4tang_luc, kich_ban_thuc_te, kich_ban_koch, kich_ban_koch_moi, kich_ban_ong_thep, kich_ban_cot_co, kich_ban_rao_vuon, kich_ban_toa_nha, kich_ban_san_pham, kich_ban_hinh_hoc, kich_ban_hinh_khong_gian, kich_ban_hinh_manim, kich_ban_hinh_dong_bo, kich_ban_mau]
        default: kich_ban_thuc_te
      viec:
        description: 'dung = dựng video | dang = đăng video lên mạng xã hội'
        type: choice
        options: [dung, dang]
        default: dung
      id:
        description: 'Mã đề (Apps Script tự điền)'
        type: string
        default: ''
      kich_ban:
        description: 'Kịch bản JSON (Apps Script tự điền)'
        type: string
        default: ''
      dang:
        description: 'Thông tin đăng bài JSON (Apps Script tự điền)'
        type: string
        default: ''
      blender:
        description: 'v91: 1 = ép dựng cảnh mở đầu bằng Blender 5.3 (mặc định: Khung 4 tầng + 3D Vector trong Remotion)'
        type: choice
        options: ['0', '1']
        default: '0'

# Mỗi đề một nhóm: đề ưu tiên (gửi qua Zalo) được dựng SONG SONG với video đang dựng, không phải xếp hàng chờ;
# cùng một đề gửi lặp thì chỉ dựng/đăng một lần.
concurrency:
  group: dung-video-${{ github.event.inputs.viec || 'dung' }}-${{ github.event.client_payload.id || github.event.inputs.id || github.run_id }}
  cancel-in-progress: ${{ github.event.inputs.viec != 'dang' }}

env:
  RCLONE_STATS: 30s
  RCLONE_STATS_ONE_LINE: "true"
  RCLONE_STATS_LOG_LEVEL: NOTICE

jobs:
  # ============ DỰNG SONG SONG (3 tầng) ============
  # 1) chuan_bi : giọng đọc, đóng gói Remotion (bundle), ảnh bìa, chia video thành SO_MAY_DUNG khúc (mặc định 4)
  # 2) dung_khuc: mỗi khúc một máy GitHub dựng cùng lúc (hình H.264 + tiếng AAC căn khung, cơ chế của Remotion Lambda)
  # 3) ghep     : ghép các khúc (không mã hóa lại => vài giây), ảnh kiểm tra, tải lên Drive, báo kết quả về Apps Script
  # Video ~12,5 phút trên 1 máy -> khoảng 6-7 phút. Đặt GitHub Variable SO_MAY_DUNG = 1 để quay về dựng trên 1 máy.
  chuan_bi:
    if: ${{ github.event.inputs.viec != 'dang' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      id: ${{ steps.chia.outputs.id }}
      giay: ${{ steps.chia.outputs.giay }}
      so_khuc: ${{ steps.chia.outputs.so_khuc }}
      khuc: ${{ steps.chia.outputs.khuc }}
      manim: ${{ steps.chia.outputs.manim }}
      chan: ${{ steps.kd.outputs.chan == 'true' || steps.bao_sua.outputs.da_bao == 'true' }}
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_NEN: ${{ vars.DRIVE_NEN }}
      DRIVE_FONT: ${{ vars.DRIVE_FONT }}
      DRIVE_THUONG_HIEU: ${{ vars.DRIVE_THUONG_HIEU }}
      DRIVE_NHAC: ${{ vars.DRIVE_NHAC }}
      # Giọng Gemini TTS (tự nhiên hơn edge-tts): thêm Secret GEMINI_API_KEY là bật; MAY_GIONG=edge để tắt
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAY_GIONG: ${{ vars.MAY_GIONG }}
      GIONG_GEMINI: ${{ vars.GIONG_GEMINI }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      TOC_DO_GEMINI: ${{ vars.TOC_DO_GEMINI }}
      AM_LUONG_NHAC: ${{ vars.AM_LUONG_NHAC }}
      NHAC_RIENG: ${{ vars.NHAC_RIENG }}
      NHAC_DUOI_GIONG_DB: ${{ vars.NHAC_DUOI_GIONG_DB }}
      PHU_DE_4TANG: ${{ vars.PHU_DE_4TANG }}
      GIONG: ${{ vars.GIONG }}
      TOC_DO: ${{ vars.TOC_DO }}
      SO_MAY_DUNG: ${{ vars.SO_MAY_DUNG }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      DUNG_VIDEO_SECRET: ${{ secrets.DUNG_VIDEO_SECRET }}
      ID_VIDEO: ${{ github.event.client_payload.id || github.event.inputs.id }}
      GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
      # v91: số luồng edge-tts song song / số luồng chuẩn âm ffmpeg (chuanbi.py in bảng thời gian từng khâu)
      EDGE_SONG_SONG: ${{ vars.EDGE_SONG_SONG || '8' }}
      THU_MUC_RA: out
      EP_BLENDER: ${{ github.event.inputs.blender || vars.EP_BLENDER || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip cho bước chuẩn bị
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-chuanbi-${{ runner.os }}-v2

      - name: Cài công cụ (chạy song song)
        run: |
          GOI="ffmpeg fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2"
          THIEU=$(for g in $GOI; do dpkg -s "$g" >/dev/null 2>&1 || echo "$g"; done | tr '\n' ' ')
          if [ -n "${THIEU// /}" ]; then
            ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $THIEU ) > /tmp/apt.log 2>&1 &
            APT=$!
          fi
          ( pip install -q "edge-tts>=7.2" gTTS numpy scipy ) > /tmp/pip.log 2>&1 &
          PIP=$!
          if [ -n "$RCLONE_CONF" ] && ! command -v rclone >/dev/null 2>&1; then
            ( curl -fsSL https://rclone.org/install.sh | sudo bash ) > /tmp/rclone.log 2>&1 &
            RC=$!
          fi
          npm ci --prefer-offline --no-audit --no-fund
          if [ -n "${APT:-}" ]; then wait $APT || { cat /tmp/apt.log; exit 1; }; fi
          wait $PIP || { cat /tmp/pip.log; exit 1; }
          if [ -n "${RC:-}" ]; then wait $RC || { cat /tmp/rclone.log; exit 1; }; fi

      - name: Lưu sẵn trình duyệt dựng hình
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Lấy tài nguyên thương hiệu / phông / nhạc (và nền nếu bật) từ Google Drive
        if: ${{ env.RCLONE_CONF != '' }}
        env:
          DUNG_NEN_DRIVE: ${{ vars.DUNG_NEN_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone public/nen public/fonts public/thuong_hieu public/nhac
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          if [ "$DUNG_NEN_DRIVE" = "1" ]; then
            NEN="${DRIVE_NEN:-VIDEO_XACSUAT/nen}"
            ( rclone copy "gdrive:$NEN" public/nen --max-size 150M --include "*.{jpg,jpeg,png,webp,mp4,mov,webm,m4v,JPG,JPEG,PNG,MP4,MOV}" || echo "Không có thư mục nền $NEN, dùng nền mặc định" ) &
          fi
          ( rclone copy "gdrive:${DRIVE_THUONG_HIEU:-VIDEO_XACSUAT/thuong_hieu}" public/thuong_hieu --include "{logo,logo_toan,logo_xac_suat,outro}.*" || echo "Chưa có thư mục thương hiệu" ) &
          ( rclone copy "gdrive:${DRIVE_FONT:-VIDEO_XACSUAT/font}" public/fonts --include "tuy_chon-*" || echo "Không có phông riêng, dùng phông đóng gói sẵn" ) &
          ( rclone copy "gdrive:${DRIVE_NHAC:-VIDEO_XACSUAT/nhac}" public/nhac --max-size 30M --include "*.{mp3,m4a,wav,ogg,MP3,M4A,WAV}" || echo "Không có thư mục nhạc riêng, dùng nhạc tự tạo" ) &
          wait
          ls -la public/thuong_hieu || true

      - name: Ghi kịch bản
        id: kb
        env:
          KICH_BAN: ${{ github.event.inputs.kich_ban || toJson(github.event.client_payload.kich_ban) }}
        run: |
          echo "Nhánh mã đang dựng: $GITHUB_REF_NAME ($GITHUB_SHA)"
          if [ -z "$KICH_BAN" ] || [ "$KICH_BAN" = "null" ]; then
            echo "Không có kịch bản gửi kèm -> dùng kịch bản mẫu"
            cp "mau/${{ github.event.inputs.mau || 'kich_ban_mau' }}.json" kich_ban.json
          else
            printf '%s' "$KICH_BAN" > kich_ban.json
          fi
          # Kịch bản nhiều cảnh (> 58KB) được Apps Script lưu trên Drive và gửi kèm _file_kich_ban_drive
          FILE_KB=$(python3 -c "import json;k=json.load(open('kich_ban.json',encoding='utf8'));print(str(k.get('_file_kich_ban_drive') or ''))" 2>/dev/null || true)
          if [ -n "$FILE_KB" ] && [ -n "$RCLONE_CONF" ]; then
            echo "Tải kịch bản đầy đủ từ Drive ID: $FILE_KB"
            mkdir -p ~/.config/rclone kb_drive
            printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
            rclone backend copyid gdrive: "$FILE_KB" kb_drive/
            F_KB=$(ls kb_drive | head -1)
            if [ -n "$F_KB" ]; then
              python3 -c "import json, glob; meta = json.load(open('kich_ban.json', encoding='utf8')); f_kb = glob.glob('kb_drive/*')[0]; kb = json.load(open(f_kb, encoding='utf8')); [kb.update({k: meta[k]}) for k in ('id', 'giong', 'gioi_tinh_giong', '_kiem_duyet', 'mon', 'luong') if k in meta and meta[k]]; json.dump(kb, open('kich_ban.json', 'w', encoding='utf8'), ensure_ascii=False); print('Đã ghép kịch bản đầy đủ từ Drive:', len(kb.get('canh') or []), 'cảnh')"
            fi
          fi
          python3 - <<'PY_HINH'
          import json, os, re
          with open("kich_ban.json", encoding="utf8") as f:
              kb = json.load(f)
          mon = str(kb.get("mon") or "").upper()
          luong = str(kb.get("luong") or "")
          # v86 KHÓA LUỒNG: kb.luong (Apps Script ghi) là nguồn quyết định; mâu thuẫn với mon -> dừng, không đoán
          if luong == "thuc_te_xac_suat" and mon == "HINH_HOC":
              raise SystemExit("::error::Kịch bản mâu thuẫn: luong=thuc_te_xac_suat nhưng mon=HINH_HOC")
          if luong == "hinh_hoc_thuan" and mon in ("THUC_TE", "XAC_SUAT"):
              raise SystemExit("::error::Kịch bản mâu thuẫn: luong=hinh_hoc_thuan nhưng mon=" + mon)
          hh = luong == "hinh_hoc_thuan" or mon == "HINH_HOC" or (not luong and re.match(r"^H[HI]", str(kb.get("id") or "").upper()) is not None)
          if not mon and not hh and not luong:
              for c in kb.get("canh") or []:
                  du = (c.get("minh_hoa") or {}).get("du_lieu")
                  if isinstance(du, dict) and any(isinstance(v, dict) and v.get("loai") == "hinh_hoc" for v in du.get("vat") or []):
                      hh = True
                      break
          if hh and luong != "hinh_hoc_thuan":   # kịch bản cũ chưa có trường luong: khóa lại để mọi bước sau đọc cùng một giá trị
              kb["luong"] = "hinh_hoc_thuan"
              kb["mon"] = "HINH_HOC"
              with open("kich_ban.json", "w", encoding="utf8") as f:
                  json.dump(kb, f, ensure_ascii=False)
          # v91: khung 4 tầng + 3D Vector (Remotion) là bộ dựng MẶC ĐỊNH của luồng thực tế & xác suất -> bỏ qua Blender.
          # Blender chỉ chạy khi kịch bản không có khung4tang hợp lệ, kb.bo_dung = blender, hoặc ép tay (input blender = 1).
          if hh and ("khung4tang" in kb or "bo_dung" in kb):   # khóa luồng hình học thuần: gỡ mọi lớp 3D Vector
              kb.pop("khung4tang", None); kb.pop("bo_dung", None)
              with open("kich_ban.json", "w", encoding="utf8") as f:
                  json.dump(kb, f, ensure_ascii=False)
          k4 = kb.get("khung4tang")
          v3d = (not hh and isinstance(k4, dict) and isinstance(k4.get("buoc"), list) and len(k4["buoc"]) > 0
                 and str(kb.get("bo_dung") or "3d_vector") != "blender" and os.environ.get("EP_BLENDER") != "1")
          print("Luồng dựng:", "hinh_hoc_thuan (Manim, không Blender)" if hh else
                ("thuc_te_xac_suat - Khung 4 tầng + 3D Vector (Remotion, bỏ qua Blender)" if v3d else "thuc_te_xac_suat - đường dựng cũ (Blender khi cần)"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"hh={int(hh)}", file=f)
              print(f"v3d={int(v3d)}", file=f)
          PY_HINH

      - name: Đối chiếu kịch bản và thử lập cảnh trước giọng đọc
        id: kich_ban_canh
        if: steps.kb.outputs.hh != '1' && steps.kb.outputs.v3d != '1'
        run: |
          pip install -q jsonschema pillow
          python3 scripts/canh_3d.py kich_ban.json --kiem-kich-ban --tu-tao
          node scripts/kiem_tra_kich_ban.cjs kich_ban.json

      - name: Cache âm thanh giọng đọc TTS
        uses: actions/cache@v4
        with:
          path: /tmp/video_ai_tts_cache
          key: tts-cache-${{ runner.os }}-v2-${{ hashFiles('kich_ban.json') }}
          restore-keys: |
            tts-cache-${{ runner.os }}-v2-
            tts-cache-${{ runner.os }}-

      # Video giới thiệu sản phẩm: lấy ẢNH THẬT của sản phẩm (Apps Script lưu ở Drive VIDEO_XACSUAT/san_pham/<mã>/)
      - name: Lấy ảnh thật của sản phẩm
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          MA=$(python3 -c "import json,re;k=json.load(open('kich_ban.json',encoding='utf8'));s=k.get('san_pham') if isinstance(k.get('san_pham'),dict) else {};print(re.sub(r'[^A-Za-z0-9_-]','',str((s or {}).get('id') or '')))")
          if [ -n "$MA" ]; then
            mkdir -p ~/.config/rclone "public/sp/$MA"
            printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
            rclone copy "gdrive:${DRIVE_SAN_PHAM:-VIDEO_XACSUAT/san_pham}/$MA" "public/sp/$MA" --max-size 12M --include "*.{jpg,jpeg,png,webp,JPG,JPEG,PNG,WEBP}" || echo "Không lấy được ảnh sản phẩm $MA"
            ls -la "public/sp/$MA" || true
          else
            echo "Video không có sản phẩm"
          fi

      - name: Cache Manim virtualenv (chỉ bài hình học)
        if: ${{ steps.kb.outputs.hh == '1' }}
        uses: actions/cache@v4
        with:
          path: /tmp/mv
          key: manim-venv-0.22.1-${{ runner.os }}-py312-v2

      - name: Cache Manim LaTeX SVG (tích lũy liên video)
        if: ${{ steps.kb.outputs.hh == '1' }}
        uses: actions/cache@v4
        with:
          path: /tmp/manim_tex_cache
          key: manim-tex-${{ runner.os }}-v2-${{ hashFiles('kich_ban.json') }}-${{ github.run_id }}
          restore-keys: |
            manim-tex-${{ runner.os }}-v2-

      - name: Tạo giọng đọc và chuẩn bị công cụ hình học song song
        env:
          CAN_MANIM: ${{ steps.kb.outputs.hh }}
        run: |
          if [ "$CAN_MANIM" = "1" ]; then
            bash scripts/cai_manim.sh &
            MANIM_PID=$!
          fi
          python3 scripts/chuanbi.py kich_ban.json
          [ -f out/thoi_gian_chuanbi.json ] && echo "Thời gian chuanbi.py: $(python3 -c "import json;print(json.load(open('out/thoi_gian_chuanbi.json'))['tong'])") s"
          if [ -n "${MANIM_PID:-}" ]; then
            if ! wait "$MANIM_PID"; then
              echo "::error::Cài đặt Manim thất bại cho bài hình học"
              exit 1
            fi
          fi

      # BÀI HÌNH HỌC: phần toán (hình, công thức, chuyển động, hiệu ứng) dựng 100% bằng MANIM (scripts/manim_hinh.py) thành
      # một lớp trong suốt; Remotion vẫn dựng PHẦN VỎ CHUNG như mọi video (nền, tiêu đề, thanh bước, phụ đề, giọng, nhạc, tiếng
      # hiệu ứng) rồi máy ghép đè lớp Manim lên. Lỗi lớp hình sẽ dừng lượt dựng.
      # v86: KIỂM TRA CHÉO BẮT BUỘC đề <-> kịch bản <-> hình <-> mốc giọng đọc trước khi dựng (không đạt -> dừng, không render)
      - name: Kiểm tra chéo hình học trước dựng
        if: steps.kb.outputs.hh == '1'
        run: |
          mkdir -p out
          # v97: hình KHÔNG GIAN chuẩn (props.boCuc = 4tang + khongGian) dựng 100% Remotion SVG: đã kiểm bằng giai_hinh_khong_gian.py
          # (mệnh đề / số đo / GDPT) + lịch camera moc_xoay trong chuanbi.py (CAM_* dừng ở bước chuẩn bị) -> không chạy kiểm tra chéo Manim
          if python3 -c "import json,sys;p=json.load(open('public/props.json',encoding='utf8'));sys.exit(0 if p.get('boCuc')=='4tang' and (p.get('khung4tang') or {}).get('khongGian') else 1)"; then
            echo "Hình không gian v97 (Remotion): bỏ kiểm tra chéo Manim"; exit 0
          fi
          python3 scripts/kiem_hinh_hoc.py kich_ban.json public/props.json --truoc --bao out/kiem_hinh_hoc.json

      - name: Dựng video hình học bằng Manim
        id: manim
        if: steps.kb.outputs.hh == '1'
        run: |
          mkdir -p out /tmp/manim_tex_cache
          # v94: kịch bản có hinh_phang_chuan (props.boCuc = hinh_phang) -> động cơ chuẩn 3 lớp (tọa độ do giai_hinh_phang.py tính);
          # còn lại (hình không gian / kịch bản cũ) -> manim_hinh.py như trước
          BO_CUC=$(python3 -c "import json;print(json.load(open('public/props.json',encoding='utf8')).get('boCuc') or '')")
          # v97: hình không gian chuẩn -> Remotion vẽ cả hình (nét khuất giải tích từng khung) -> không có lớp Manim (manim=0)
          if [ "$BO_CUC" = "4tang" ]; then echo "Hình không gian v97: không dựng Manim"; exit 0; fi
          if [ "$BO_CUC" = "hinh_phang" ]; then
            python3 scripts/giai_hinh_phang.py kich_ban.json --ra out/hinh_phang_giai.json
            MANIM_TEX_DIR=/tmp/manim_tex_cache /tmp/mv/bin/python scripts/manim/HinhPhangChuan.py public/props.json kich_ban.json out --public public
          else
            /tmp/mv/bin/python scripts/manim_hinh.py public/props.json kich_ban.json out --public public
          fi
          ID=$(python3 -c "import json;print(json.load(open('public/props.json',encoding='utf8'))['id'])")
          [ -s "out/${ID}_manim.mov" ] || { echo "Manim không ra video"; exit 1; }
          # đủ cảnh + từng nét vẽ khớp mốc lời đọc (lệch <= 0,25 s), không đạt -> dừng
          python3 scripts/kiem_hinh_hoc.py kich_ban.json public/props.json --sau --bao out/kiem_hinh_hoc_sau.json
          ls -la out
          echo "ok=1" >> "$GITHUB_OUTPUT"

      # v91: khung 4 tầng + 3D Vector -> chỉ chạy test động cơ 3D Vector (vài giây), không lập kế hoạch / cài / dựng Blender
      - name: Kiểm tra động cơ 3D Vector (khung 4 tầng)
        if: steps.kb.outputs.v3d == '1'
        run: |
          node scripts/test_canh_3d_vector.mjs
          python3 -c "import json;p=json.load(open('public/props.json',encoding='utf8'));k=p.get('khung4tang');print('Khung 4 tầng:',len(k['buoc']),'bước') if p.get('boCuc')=='4tang' and k else print('::warning::chuanbi.py không sinh được khung4tang -> dựng giao diện cũ (không Blender)')"

      - name: Kiểm tra dữ kiện và chọn bộ dựng 3D
        id: bo_dung_3d
        if: steps.kb.outputs.hh != '1' && steps.kb.outputs.v3d != '1'
        run: |
          python3 scripts/test_canh_3d.py
          python3 scripts/test_dac_ta_canh.py
          SO_CANH=$(python3 scripts/canh_3d.py kich_ban.json public/props.json --chuan-bi)
          echo "so_canh_blender=$SO_CANH" >> "$GITHUB_OUTPUT"

      - name: Cache Blender 5.3 (ghim cùng bản với máy dựng thử)
        if: steps.bo_dung_3d.outputs.so_canh_blender != '' && steps.bo_dung_3d.outputs.so_canh_blender != '0'
        uses: actions/cache@v4
        with:
          path: ~/blender-5.3
          key: blender-5.3.0-linux-x64

      - name: Cài Blender và Manim cho cảnh có bản vẽ
        if: steps.bo_dung_3d.outputs.so_canh_blender != '' && steps.bo_dung_3d.outputs.so_canh_blender != '0'
        run: |
          # Blender chính thức 5.3.0 (apt của Ubuntu 24.04 chỉ có 4.0 -> ảnh lệch so với máy dựng thử).
          if [ ! -x ~/blender-5.3/blender ]; then
            curl -fsSL --retry 3 https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
            mkdir -p ~/blender-5.3
            tar -xJf /tmp/blender.tar.xz -C ~/blender-5.3 --strip-components=1
            rm /tmp/blender.tar.xz
          fi
          sudo apt-get install -y -qq --no-install-recommends libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libegl1 >/dev/null
          sudo ln -sf ~/blender-5.3/blender /usr/local/bin/blender
          blender --version | head -1
          bash scripts/cai_manim.sh

      - name: Dựng bối cảnh Blender và lớp hình toán
        if: steps.bo_dung_3d.outputs.so_canh_blender != '' && steps.bo_dung_3d.outputs.so_canh_blender != '0'
        run: python3 scripts/canh_3d.py kich_ban.json public/props.json

      - name: Gọn tài nguyên & đóng gói Remotion + ảnh bìa
        run: |
          python3 - <<'PY'
          import json, os, shutil
          with open('public/props.json', encoding='utf8') as f:
              p = json.load(f)
          giu = set()
          for k in ('nhac', 'nen', 'anhManimBia'):
              if p.get(k):
                  giu.add(str(p[k]).lstrip('/'))
          for x in (p.get('dsNen') or []):
              if isinstance(x, dict) and x.get('tep'):
                  giu.add(str(x['tep']).lstrip('/'))
          if isinstance(p.get('quangCao'), dict) and p['quangCao'].get('anh'):
              giu.add(str(p['quangCao']['anh']).lstrip('/'))
          # Bảo toàn toàn bộ ảnh sản phẩm dùng trong các cảnh (anh_1, anh_2, ...)
          for c in (p.get('canh') or []):
              du = ((c or {}).get('minhHoa') or {}).get('duLieu') or {}
              if isinstance(du, dict):
                  for v in (du.get('vat') or []):
                      if isinstance(v, dict):
                          for vk in ('anhSrc', 'src', 'anh'):
                              val = v.get(vk)
                              if isinstance(val, str) and '/' in val and not val.startswith('http'):
                                  giu.add(val.lstrip('/'))
          for sub in ('nen', 'nhac', 'sp'):
              goc = os.path.join('public', sub)
              if not os.path.isdir(goc):
                  continue
              for root, dirs, files in os.walk(goc):
                  for fn in files:
                      fp = os.path.join(root, fn)
                      rel = os.path.relpath(fp, 'public').replace('\\', '/')
                      if rel not in giu:
                          os.remove(fp)
          PY
          ID=$(python3 -c "import json;print(json.load(open('public/props.json',encoding='utf8'))['id'])")
          # đóng gói SAU khi có giọng đọc/nhạc (thư mục public được chép vào gói)
          npx remotion bundle src/index.ts --out-dir build
          mkdir -p out build/public/bia
          # ẢNH BÌA thiết kế (loại câu hỏi, lớp, tập, tiêu đề, hình minh họa thật của đề) -> out/ID_bia.jpg
          KHUNG=$(python3 -c "import json;print((json.load(open('public/props.json',encoding='utf8')).get('bia') or {}).get('khung',60))")
          if npx remotion still build AnhBia "out/${ID}_bia.png" --props=public/props.json --frame=$KHUNG; then
            ffmpeg -y -loglevel error -i "out/${ID}_bia.png" -q:v 3 "out/${ID}_bia.jpg"
            cp "out/${ID}_bia.png" "build/public/bia/${ID}.png"
            # khung hình đầu của video = ảnh bìa (TikTok lấy khung 0 làm ảnh bìa)
            python3 -c "import json;f='public/props.json';p=json.load(open(f,encoding='utf8'));p['anhBiaDau']='bia/${ID}.png';p['tongFrame']+=1;open(f,'w',encoding='utf8').write(json.dumps(p,ensure_ascii=False))"
          else
            echo "Không dựng được ảnh bìa, video vẫn dựng bình thường"
          fi
          rm -f out/*.png

      # KIỂM DUYỆT BỐ CỤC: chụp 2 khung mẫu mỗi cảnh, đo chữ tràn mép / đè nhau / bị cắt / mã TeX thô / công thức lỗi / chữ quá nhỏ.
      # Kịch bản từ Apps Script (_kiem_duyet = chan): có lỗi nặng thì KHÔNG dựng, gửi báo cáo về để Gemini sửa kịch bản rồi dựng lại.
      # Dựng thử tay (không có mã đề) hoặc _kiem_duyet = bao: chỉ ghi báo cáo, vẫn dựng.
      - name: Kiểm duyệt bố cục
        id: kd
        run: |
          # Giữ lỗi đã đo khi hết 7 phút; nếu chưa đo được khung nào thì dùng báo cáo dự phòng.
          rm -f out/kiem_duyet.json
          set +e
          timeout --kill-after=5s 415s node scripts/kiem_duyet.mjs build public/props.json out/kiem_duyet.json kich_ban.json 2>&1 | grep -v "character metrics\|memory\|Memory\|docker\|lower amount"
          KD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$KD_RC" -ne 0 ]; then
            echo "Kiểm duyệt bố cục thoát mã $KD_RC (quá 7 phút hoặc lỗi trình duyệt) -> giữ kết quả đã đo nếu có"
          fi
          python3 -c "import json;json.load(open('out/kiem_duyet.json'))" 2>/dev/null || echo '{"nang":[],"nhe":[],"hong":true}' > out/kiem_duyet.json
          python3 - <<'PY'
          import json, os
          b = json.load(open('out/kiem_duyet.json', encoding='utf8'))
          kb = json.load(open('kich_ban.json', encoding='utf8'))
          che_do = str(kb.get('_kiem_duyet') or ('chan' if os.environ.get('ID_VIDEO') else 'bao'))
          chan = che_do == 'chan' and len(b.get('nang') or []) > 0 and bool(os.environ.get('ID_VIDEO'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('chan=%s\n' % ('true' if chan else 'false'))
          print('Chế độ kiểm duyệt: %s | lỗi nặng: %d | %s' % (che_do, len(b.get('nang') or []), 'DỪNG, gửi về tự sửa' if chan else 'dựng tiếp'))
          PY

      # key Gemini LỖI THẬT phát hiện khi tạo giọng đọc / AI nhìn hình: báo Apps Script -> Zalo nhắc người dùng gỡ key
      - name: Báo key Gemini hỏng
        if: ${{ always() && env.APPS_SCRIPT_URL != '' }}
        run: |
          [ -s /tmp/gemini_key_hong.json ] || { echo "Không có key hỏng"; exit 0; }
          python3 - <<'PY'
          import json, os
          d = {"token": os.environ["DUNG_VIDEO_SECRET"], "loai": "key_hong", "key_hong": json.load(open("/tmp/gemini_key_hong.json", encoding="utf8"))}
          json.dump(d, open("bao_key_hong.json", "w", encoding="utf8"), ensure_ascii=False)
          print("Key hỏng:", [(k.get("so"), k.get("ly_do")) for k in d["key_hong"]])
          PY
          for lan in 1 2 3; do
            KQ=$(curl -sS -L --max-time 45 -H 'Content-Type: application/json' --data @bao_key_hong.json "$APPS_SCRIPT_URL" || true)
            if echo "$KQ" | grep -Eq '"ok" *: *true|SAI_TOKEN'; then break; fi
            if echo "$KQ" | grep -q 'BAN'; then sleep 45; continue; fi
            sleep 15
          done

      - name: Kiểm duyệt không đạt - báo về Apps Script để tự sửa kịch bản
        id: bao_sua
        if: always() && env.APPS_SCRIPT_URL != '' && env.ID_VIDEO != '' && (steps.kd.outputs.chan == 'true' || ((steps.bo_dung_3d.outcome == 'failure' || steps.kich_ban_canh.outcome == 'failure') && hashFiles('out/loi_mo_hinh.json') != ''))
        run: |
          python3 - <<'PY'
          import json, os
          path = 'out/loi_mo_hinh.json' if os.path.isfile('out/loi_mo_hinh.json') else 'out/kiem_duyet.json'
          b = json.load(open(path, encoding='utf8'))
          d = {"token": os.environ["DUNG_VIDEO_SECRET"], "id": os.environ["ID_VIDEO"], "ok": False, "loi": "KIEM_DUYET_BO_CUC",
               "kiem_duyet": {"loai": "mo_hinh" if path.endswith("loi_mo_hinh.json") else "bo_cuc", "nang": b.get("nang", [])[:15], "nhe": b.get("nhe", [])[:10]}}
          json.dump(d, open("bao_kiem_duyet.json", "w", encoding="utf8"), ensure_ascii=False)
          PY
          for lan in 1 2 3 4 5 6; do
            KQ=$(curl -sS -L --max-time 45 -H 'Content-Type: application/json' --data @bao_kiem_duyet.json "$APPS_SCRIPT_URL" || true)
            echo "Lần $lan: $KQ"
            if echo "$KQ" | grep -Eq '"ok" *: *true|KHONG_TIM_THAY'; then echo "da_bao=true" >> "$GITHUB_OUTPUT"; break; fi
            if echo "$KQ" | grep -q 'SAI_TOKEN'; then echo "SAI_TOKEN"; break; fi
            if echo "$KQ" | grep -q 'BAN'; then sleep 60; continue; fi
            sleep 20
          done
          echo "Bố cục chưa đạt: dừng dựng (Apps Script sẽ sửa kịch bản rồi gửi dựng lại)"; exit 1

      - name: Chia khúc
        id: chia
        env:
          MANIM_OK: ${{ steps.manim.outputs.ok }}
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('public/props.json', encoding='utf8'))
          tong = p['tongFrame']
          muon = int(os.environ.get('SO_MAY_DUNG') or 4)
          # mỗi khúc ít nhất ~5 giây, tối đa 10 máy (video ngắn không chia nhỏ quá, tốn công khởi động máy)
          n = max(1, min(muon, 10, tong // 150))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('id=%s\n' % p['id'])
              f.write('giay=%d\n' % round(tong / p['fps']))
              f.write('so_khuc=%d\n' % n)
              f.write('khuc=%s\n' % json.dumps(list(range(n))))
              f.write('manim=%s\n' % ('1' if os.environ.get('MANIM_OK') == '1' else '0'))
          print('Video %s: %d khung (%.1f giây) -> %d khúc' % (p['id'], tong, tong / p['fps'], n))
          PY

      - name: Gửi gói dựng cho các máy
        if: steps.kd.outputs.chan != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goi
          path: |
            build
            public/props.json
          retention-days: 1
          compression-level: 1

      - name: Gửi thông tin cho máy ghép
        if: steps.kd.outputs.chan != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thong-tin
          path: |
            public/props.json
            out/*_bia.jpg
            out/*_manim.mov
            out/kiem_duyet.json
          retention-days: 1
          if-no-files-found: ignore

  dung_khuc:
    if: needs.chuan_bi.outputs.chan != 'true'
    needs: chuan_bi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        khuc: ${{ fromJSON(needs.chuan_bi.outputs.khuc) }}
    name: dựng khúc ${{ matrix.khuc }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: |
          # chỉ cài các gói hệ thống còn thiếu (máy GitHub đã có sẵn phần lớn thư viện của Chrome)
          GOI="fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2"
          THIEU=$(for g in $GOI; do dpkg -s "$g" >/dev/null 2>&1 || echo "$g"; done | tr '\n' ' ')
          if [ -n "${THIEU// /}" ]; then
            echo "Cài thêm: $THIEU"
            ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $THIEU ) > /tmp/apt.log 2>&1 &
            APT=$!
          fi
          npm ci --prefer-offline --no-audit --no-fund
          if [ -n "${APT:-}" ]; then wait $APT || { cat /tmp/apt.log; exit 1; }; fi

      - name: Lưu sẵn trình duyệt dựng hình
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/download-artifact@v4
        with:
          name: goi

      - name: Dựng khúc ${{ matrix.khuc }}
        run: node scripts/dung_khuc.mjs build public/props.json ${{ matrix.khuc }} ${{ needs.chuan_bi.outputs.so_khuc }} khuc

      - uses: actions/upload-artifact@v4
        with:
          name: khuc-${{ matrix.khuc }}
          path: khuc
          retention-days: 1
          compression-level: 0

  ghep:
    needs: [chuan_bi, dung_khuc]
    # luôn chạy (kể cả khi dựng lỗi) để báo kết quả về Apps Script; bỏ qua khi việc là "dang" hoặc dừng do kiem_duyet chan=true
    if: ${{ always() && needs.chuan_bi.result != 'skipped' && needs.chuan_bi.outputs.chan != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      DUNG_VIDEO_SECRET: ${{ secrets.DUNG_VIDEO_SECRET }}
      DRIVE_THU_MUC: ${{ vars.DRIVE_THU_MUC }}
      DA_DUNG: ${{ needs.chuan_bi.result == 'success' && needs.dung_khuc.result == 'success' }}
      MANIM: ${{ needs.chuan_bi.outputs.manim }}
      # v91 Mắt thần 3×3: tái dùng kho key Gemini sẵn có (goi_gemini.js xoay key, né 404/429). Tắt: GitHub Variable MAT_THAN_3X3 = TAT
      GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAT_THAN_MODEL: ${{ vars.MAT_THAN_MODEL }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.DA_DUNG == 'true' }}
        with:
          sparse-checkout: |
            scripts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: ${{ env.DA_DUNG == 'true' }}
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        if: ${{ env.DA_DUNG == 'true' }}
        with:
          python-version: '3.12'

      - name: Cài thư viện
        if: ${{ env.DA_DUNG == 'true' }}
        run: |
          ( pip install -q pillow numpy ) > /tmp/pip.log 2>&1 &
          PIP=$!
          if [ -n "$RCLONE_CONF" ] && ! command -v rclone >/dev/null 2>&1; then
            ( curl -fsSL https://rclone.org/install.sh | sudo bash ) > /tmp/rclone.log 2>&1 &
            RC=$!
          fi
          npm ci --prefer-offline --no-audit --no-fund
          wait $PIP || { cat /tmp/pip.log; exit 1; }
          if [ -n "${RC:-}" ]; then wait $RC || { cat /tmp/rclone.log; exit 1; }; fi

      - uses: actions/download-artifact@v4
        if: ${{ env.DA_DUNG == 'true' }}
        with:
          name: thong-tin

      - uses: actions/download-artifact@v4
        if: ${{ env.DA_DUNG == 'true' }}
        with:
          pattern: khuc-*
          path: khuc
          merge-multiple: true

      - name: Ghép video
        id: dung
        if: ${{ env.DA_DUNG == 'true' }}
        run: |
          ID="${{ needs.chuan_bi.outputs.id }}"
          mkdir -p out
          node scripts/ghep_khuc.mjs khuc "out/$ID.mp4"
          if [ "$MANIM" = "1" ]; then
            # bài hình học: ghép đè lớp Manim (hình + công thức, nền trong suốt) lên phần vỏ chung do Remotion dựng.
            # Khung 0 là ảnh bìa (anhBiaDau) -> lớp Manim lùi 1 khung; có intro thương hiệu -> lùi thêm intro.lech khung.
            [ -s "out/${ID}_manim.mov" ] || { echo "Thiếu lớp Manim"; exit 1; }
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /tmp/apt_ff.log 2>&1; }
            LUI=$(python3 -c "import json;p=json.load(open('public/props.json',encoding='utf8'));print((1 if p.get('anhBiaDau') else 0)+int((p.get('intro') or {}).get('lech') or 0))")
            ffmpeg -y -loglevel error -i "out/$ID.mp4" -i "out/${ID}_manim.mov" -filter_complex \
              "[1:v]format=rgba,tpad=start=${LUI}:color=0x00000000[m];[0:v][m]overlay=0:0:eof_action=pass:format=auto[v]" \
              -map "[v]" -map 0:a -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p -c:a copy -movflags +faststart "out/${ID}_ghep.mp4"
            mv "out/${ID}_ghep.mp4" "out/$ID.mp4"
            rm -f "out/${ID}_manim.mov"
            echo "Đã ghép lớp Manim"
          fi
          # Nếu video dài (ví dụ video 10 phút) có dung lượng > 42 MB, tự động nén tối ưu dưới 42 MB để Apps Script YouTube API (giới hạn 48 MB) luôn đăng trực tiếp được
          KICH_THUOC=$(stat -c%s "out/$ID.mp4" 2>/dev/null || echo 0)
          if [ "$KICH_THUOC" -gt 44000000 ]; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /tmp/apt_ff.log 2>&1; }
            ffmpeg -y -loglevel error -i "out/$ID.mp4" -c:v libx264 -preset veryfast -crf 23 -maxrate 850k -bufsize 1700k -pix_fmt yuv420p -c:a copy -movflags +faststart "out/${ID}_nen.mp4"
            mv "out/${ID}_nen.mp4" "out/$ID.mp4"
            echo "Đã tối ưu dung lượng video dài xuống dưới 42 MB"
          fi
          ls -la out
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          python3 scripts/kiem_tra_chuyen_dong.py public/props.json "out/$ID.mp4" out/chuyen_dong.json
          python3 scripts/anh_kiem_tra.py public/props.json "out/$ID.mp4" out/

      # v91 MẮT THẦN AI: 9 khung mốc -> lưới 3×3 -> Gemini Flash tìm cắt chữ / chồng chữ / LaTeX thô / lộ đáp án sớm.
      # Lỗi nặng -> báo Apps Script (kiem_tra_mp4.dat = false) => video giữ ở CHO, không vào lịch đăng, Zalo nhận ảnh lưới + lỗi.
      # Bản thân Mắt thần lỗi (thiếu key, hết hạn mức) -> không chặn, BP4 vẫn chấm trước khi DA_DUYET.
      - name: Mắt thần AI quét lưới 3×3
        id: mat_than
        if: ${{ steps.dung.outcome == 'success' && vars.MAT_THAN_3X3 != 'TAT' }}
        continue-on-error: true
        run: python3 scripts/mat_than_3x3.py public/props.json "out/${{ steps.dung.outputs.id }}.mp4" out/

      - name: Lưu bản sao 3 ngày trên GitHub
        if: ${{ steps.dung.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.dung.outputs.id }}
          path: out/*.mp4
          retention-days: 3
          compression-level: 0

      - name: Tải video lên Google Drive
        id: drive
        if: ${{ steps.dung.outcome == 'success' && env.RCLONE_CONF != '' }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          THU_MUC="${DRIVE_THU_MUC:-VIDEO_XACSUAT/video}"
          ID="${{ steps.dung.outputs.id }}"
          rclone copy "out/$ID.mp4" "gdrive:$THU_MUC"
          FILE_ID=$(rclone lsjson "gdrive:$THU_MUC" --files-only --include "$ID.mp4" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['ID'] if d else '')")
          if [ -z "$FILE_ID" ]; then echo "Không lấy được ID tệp trên Drive"; exit 1; fi
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          for LOAI in kt bia 3x3; do
            if [ -f "out/${ID}_${LOAI}.jpg" ]; then
              rclone copy "out/${ID}_${LOAI}.jpg" "gdrive:$THU_MUC/anh"
              AID=$(rclone lsjson "gdrive:$THU_MUC/anh" --files-only --include "${ID}_${LOAI}.jpg" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['ID'] if d else '')" || true)
              echo "anh_${LOAI}=$AID" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Báo kết quả về Apps Script
        if: ${{ always() && (github.event_name == 'repository_dispatch' || github.event.inputs.id != '') && env.APPS_SCRIPT_URL != '' }}
        env:
          ID_VIDEO: ${{ github.event.client_payload.id || github.event.inputs.id }}
          FILE_ID: ${{ steps.drive.outputs.file_id }}
          ANH_KT: ${{ steps.drive.outputs.anh_kt }}
          ANH_BIA: ${{ steps.drive.outputs.anh_bia }}
          ANH_3X3: ${{ steps.drive.outputs.anh_3x3 }}
          GIAY: ${{ needs.chuan_bi.outputs.giay }}
          TRANG_THAI: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          ok = os.environ.get("TRANG_THAI") == "success" and os.environ.get("DA_DUNG") == "true" and bool(os.environ.get("FILE_ID"))
          d = {
              "token": os.environ["DUNG_VIDEO_SECRET"],
              "id": os.environ["ID_VIDEO"],
              "ok": ok,
              "file_id": os.environ.get("FILE_ID", ""),
              "giay": os.environ.get("GIAY", ""),
              "anh_kt": os.environ.get("ANH_KT", ""),
              "anh_bia": os.environ.get("ANH_BIA", ""),
              "loi": "" if ok else "Xem nhật ký: https://github.com/%s/actions/runs/%s" % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
          }
          if ok:
              with open('out/chuyen_dong.json') as f:
                  kd = json.load(f)
              bo_cuc = {}
              if os.path.exists('out/kiem_duyet.json'):
                  with open('out/kiem_duyet.json') as f:
                      bo_cuc = json.load(f)
              reasons = list((bo_cuc.get('nang') or [])[:2])
              seen, total = bo_cuc.get('so_khung'), bo_cuc.get('so_khung_mau')
              if bo_cuc.get('hong', True):
                  if total is not None and seen != total:
                      reasons.append(f"Bố cục: đã đo {seen}/{total} khung")
                  elif bo_cuc.get('ai_nhin') == 'khong_chay':
                      reasons.append("Kiểm duyệt hình ảnh chưa hoàn tất")
                  else:
                      reasons.append("Chưa hoàn tất báo cáo bố cục")
              # v91 Mắt thần 3×3: lỗi nặng -> chặn (kèm danh sách lỗi + ảnh lưới để Apps Script gửi Zalo)
              if os.path.exists('out/mat_than.json'):
                  try:
                      mt = json.load(open('out/mat_than.json', encoding='utf8'))
                  except Exception:
                      mt = {}
                  d['mat_than'] = {k: mt.get(k) for k in ('dat', 'chay', 'loi', 'ly_do', 'canh_bao', 'o_dap_an')}
                  d['anh_3x3'] = os.environ.get("ANH_3X3", "")
                  if mt.get('chay') and mt.get('dat') is False:
                      reasons.insert(0, mt.get('ly_do') or 'Mắt thần 3×3 phát hiện lỗi nặng')
              if reasons:
                  kd = {"dat": False, "ly_do": ". ".join(reasons + ([kd["ly_do"]] if kd.get("ly_do") else []))}
              d['kiem_tra_mp4'] = kd
          json.dump(d, open("bao_ket_qua.json", "w"))
          PY
          # Apps Script có thể đang bận chạy Bộ phận 1 (tối đa ~6 phút): chỉ khi nó trả lời "BAN" mới thử lại.
          # Quan trọng: KHÔNG dùng "-X POST" cùng "-L". Apps Script xử lý yêu cầu rồi chuyển hướng (302);
          # "-X POST" làm curl gửi POST lần nữa tới địa chỉ chuyển hướng, nhận lỗi 405 và bị hiểu nhầm là thất bại.
          for lan in 1 2 3 4 5 6 7; do
            KQ=$(curl -sS -L -H 'Content-Type: application/json' --data @bao_ket_qua.json "$APPS_SCRIPT_URL" || true)
            echo "Lần $lan: $KQ"
            if echo "$KQ" | grep -Eq '"ok" *: *true'; then exit 0; fi
            if echo "$KQ" | grep -q 'KHONG_TIM_THAY'; then echo "Dòng đã được dọn khỏi hàng đợi, bỏ qua"; exit 0; fi
            if echo "$KQ" | grep -q 'SAI_TOKEN'; then exit 1; fi
            if echo "$KQ" | grep -q '"BAN"\|BAN'; then sleep 60; continue; fi
            if [ "$lan" -ge 2 ]; then break; fi   # phản hồi lạ (không phải JSON): thử thêm 1 lần rồi dừng, tránh gọi lặp
            sleep 20
          done
          echo "Không báo được kết quả về Apps Script"; exit 1

  # ĐĂNG VIDEO lên Facebook / TikTok / YouTube (DangVideo.gs trên Apps Script hẹn giờ rồi gọi việc này).
  # Secrets cần (thêm cái nào thì nền tảng đó mới đăng; xem SUA_CODE_LAN_16.md):
  #   Facebook: FB_PAGE_ID, FB_PAGE_TOKEN
  #   TikTok:   TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, TIKTOK_REFRESH_TOKEN (mã làm mới mới nhất được lưu vào Drive VIDEO_XACSUAT/bi_mat)
  #   YouTube (chỉ khi CAU_HINH YOUTUBE_CACH = github): YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
  dang:
    if: ${{ github.event.inputs.viec == 'dang' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      DUNG_VIDEO_SECRET: ${{ secrets.DUNG_VIDEO_SECRET }}
      DANG_JSON: ${{ github.event.inputs.dang }}
      ID_VIDEO: ${{ github.event.inputs.id }}
      DRIVE_THU_MUC: ${{ vars.DRIVE_THU_MUC }}
      DRIVE_BI_MAT: ${{ vars.DRIVE_BI_MAT }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_CHE_DO: ${{ vars.TIKTOK_CHE_DO }}
      TIKTOK_QUYEN: ${{ vars.TIKTOK_QUYEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CHE_DO: ${{ vars.YT_CHE_DO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài công cụ
        run: |
          pip install -q requests
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)   # in số tập vào video lúc đăng
          command -v rclone >/dev/null || (curl -fsSL --retry 3 --retry-delay 5 https://rclone.org/install.sh | sudo bash || (sudo apt-get update -qq && sudo apt-get install -y -qq rclone))
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Đăng video
        id: dang_py
        run: python3 scripts/dang_video.py
      - name: Báo lỗi đăng về Apps Script nếu workflow gặp sự cố
        if: ${{ failure() && env.APPS_SCRIPT_URL != '' && env.ID_VIDEO != '' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          p = {
              "token": os.environ["DUNG_VIDEO_SECRET"],
              "loai": "dang",
              "id": os.environ["ID_VIDEO"],
              "ket_qua": {"_github_loi": "GitHub workflow dang gap loi: https://github.com/%s/actions/runs/%s" % (os.environ.get("GITHUB_REPOSITORY", ""), os.environ.get("GITHUB_RUN_ID", ""))},
          }
          json.dump(p, open("bao_loi_dang.json", "w"))
          PY
          for lan in 1 2 3 4; do
            KQ=$(curl -sS -L -H 'Content-Type: application/json' --data @bao_loi_dang.json "$APPS_SCRIPT_URL" || true)
            echo "Báo lỗi đăng lần $lan: $KQ"
            if echo "$KQ" | grep -Eq '"ok" *: *true|KHONG_TIM_THAY'; then exit 0; fi
            sleep 15
          done
